[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-beacon"
version = "0.1.0"
description = "A protocol-neutral trial and readiness lab for AI agents, tools, and multi-agent systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Project Beacon contributors" }
]
keywords = ["agents", "mcp", "a2a", "evaluation", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RealMaxPower/project-beacon"
Repository = "https://github.com/RealMaxPower/project-beacon"
Issues = "https://github.com/RealMaxPower/project-beacon/issues"
Changelog = "https://github.com/RealMaxPower/project-beacon/releases"

# The core stays stdlib-only so `python3 -m beacon run` works in an empty
# environment. Extras add depth, never a requirement: with jsonschema absent
# the loader still enforces the scenario contract in code, and the
# schema-conformance tests skip rather than fail.
[project.optional-dependencies]
validate = ["jsonschema>=4.21"]

[project.scripts]
beacon = "beacon.cli:main"

[tool.setuptools]
packages = [
  "beacon",
  "beacon.adapters",
  "beacon.protocols",
  "beacon.services",
  "beacon.builtin_scenarios",
]

[tool.setuptools.package-dir]
"beacon.builtin_scenarios" = "scenarios"

[tool.setuptools.package-data]
"beacon.builtin_scenarios" = ["*/scenario.json"]


