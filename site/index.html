<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beacon — try an agent on realistic work before trusting it with real work</title>
    <meta
      name="description"
      content="An open trial and readiness lab for AI agents. Run one on synthetic work, watch every tool call, and get deterministic evidence back."
    />
    <!--
      Open Graph, with no image.

      Without these, every link to this site — in Slack, a DM, a forum post —
      renders as a bare URL, which is the least persuasive form a link can
      take. A `summary` card carries the title and description; a
      `summary_large_image` one would need a picture, and there is no picture
      on this site by design.

      These duplicate the title and description above, so a test asserts they
      match. Two copies of a sentence is exactly the shape that drifts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/RealMaxPower/project-beacon" />
    <meta
      property="og:title"
      content="Beacon — try an agent on realistic work before trusting it with real work"
    />
    <meta
      property="og:description"
      content="An open trial and readiness lab for AI agents. Run one on synthetic work, watch every tool call, and get deterministic evidence back."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
