<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Beacon — outcome assurance for AI agents</title>
    <meta
      name="description"
      content="Turn agent output into source-linked evidence, explicit checks, and a verdict you can hand to someone else. Every claim on this page is generated from the repository."

    <!--
      The second design's entry document.

      It repeats the title and description as Open Graph tags for the same
      reason the first one does: a crawler reads the served HTML and will not
      run the app, so the tags have to be a second copy — and a second copy of
      a sentence is the shape that drifts. A test holds them to each other.

      No `og:image`. There is no picture on either site by design, and a card
      that promises one renders as a broken card rather than a small one.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/RealMaxPower/project-beacon" />
    <meta property="og:title" content="Project Beacon — outcome assurance for AI agents" />
    <meta
      property="og:description"
      content="Turn agent output into source-linked evidence, explicit checks, and a verdict you can hand to someone else. Every claim on this page is generated from the repository."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  </head>

    <script type="module" src="/src-b/main-b.tsx"></script>
