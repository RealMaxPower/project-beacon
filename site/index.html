<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Beacon — outcome assurance for AI agents</title>
    <meta
      name="description"
      content="Turn agent output into source-linked evidence, explicit checks, and a verdict you can hand to someone else. Every claim on this page is generated from the repository."
    />

    <!--
      The second design's entry document.

      It repeats the title and description as Open Graph tags for the same
      reason the first one does: a crawler reads the served HTML and will not
      run the app, so the tags have to be a second copy — and a second copy of
      a sentence is the shape that drifts. A test holds them to each other.

      No `og:image`. There is no picture on either site by design, and a card
      that promises one renders as a broken card rather than a small one.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/RealMaxPower/project-beacon" />
    <meta property="og:title" content="Project Beacon — outcome assurance for AI agents" />
    <meta
      property="og:description"
      content="Turn agent output into source-linked evidence, explicit checks, and a verdict you can hand to someone else. Every claim on this page is generated from the repository."
    />
    <meta name="twitter:card" content="summary" />

    <!--
      No font preloads, and `font-display: optional` on every face.

      Two `<link rel="preload" as="font">` hints were added here as insurance
      against a swap reflow. An A/B against this exact build, three runs each
      under CDP throttling, showed they prevent nothing and cost about 300ms of
      first paint: CLS identical to four decimal places with and without,
      FCP 952ms against 612ms on desktop and 900ms against 588ms on mobile.

      The reflow was real, though — a single-shot measurement had said CLS was
      zero and it is around 0.05, with one sample over the 0.1 threshold. What
      removes it is `optional`, which tells the browser to use the fallback and
      never swap: CLS 0, and FCP better than either variant above. A face that
      misses its window is simply not used on that load, which for a typeface
      is the right trade and for the reflow is the whole of the fix.
    -->
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <!--
      The legacy paths. Modern browsers are content with the SVG above; some
      crawlers, feed readers and iOS home-screen saves still request these
      exact names, and each one was a 404.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src-b/main-b.tsx"></script>
  </body>
</html>
