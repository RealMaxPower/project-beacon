name: Conformance (external targets)

# Manual only, on purpose.
#
# Two reasons, and the second outlives the first. Actions minutes are billed
# on a private repository. And this sweep calls other people's running
# services, so it should stay rare and deliberate however little it costs us.
#
# So the automatic triggers are commented out rather than deleted. Nothing
# here runs unless someone starts it from the Actions tab, and while the
# repository stays private that is the correct setting.
#
# WHEN THE REPOSITORY GOES PUBLIC: Actions is free on public repositories,
# and uncommenting the block below restores the automatic runs at no cost.

on:
  workflow_dispatch:
  # Uncomment when the repository is public. The schedule is deliberately
  # weekly rather than per-push: this sweep calls other people's running
  # services, so it should stay rare whatever it costs us.
  # schedule:
  #   - cron: "0 6 * * 1"
  # push:
  #   paths:
  #     - "beacon/protocols/**"
  #     - "conformance/**"

permissions:
  contents: read

jobs:
  mcp-servers:
    name: Beacon's MCP client vs third-party servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv (for the Python MCP servers)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sweep
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python conformance/run_mcp_sweep.py --timeout 180 --json-out sweep.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-conformance
          path: sweep.json

  official-sdk:
    name: Official MCP SDK vs Beacon's facade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The reference implementation of the protocol, driving Beacon's server.
      # Without this the facade is only ever exercised by a client this repo
      # also wrote, which proves that Beacon agrees with Beacon.
      - name: Install the official MCP SDK
        run: python -m pip install --upgrade pip && python -m pip install mcp

      - name: Run the scenario through the official SDK
        run: |
          python -m beacon run scenarios/inbox-briefing/scenario.json \
            --adapter mcp-host \
            --command "python conformance/official_sdk_client.py"
