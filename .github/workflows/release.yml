name: release

# Manual only, on purpose.
#
# Actions minutes are billed on a private repository, and there is nothing to
# release from one: publishing to PyPI from a repository nobody can read would
# put a package on the index whose source is not there to check.
#
# So the automatic triggers are commented out rather than deleted. Nothing
# here runs unless someone starts it from the Actions tab, and while the
# repository stays private that is the correct setting.
#
# WHEN THE REPOSITORY GOES PUBLIC: Actions is free on public repositories,
# and uncommenting the block below restores the automatic runs at no cost.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (otherwise build and check only)"
        type: boolean
        default: false
  # Uncomment when the repository is public, so that tagging a version
  # publishes it:
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the metadata PyPI will render
        run: python -m twine check --strict dist/*

      - name: The version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("pyproject.toml").read_text()
          version = re.search(r'^version = "([^"]+)"', text, re.M).group(1)
          if version != tag:
              sys.exit(f"tag {tag} does not match pyproject version {version}")
          print(f"tag and version agree: {version}")
          PY

      # A wheel that imports is not a wheel that works. This installs it
      # somewhere with no source tree and exercises the paths a new user
      # actually takes, which is how the missing scenarios were found.
      - name: Install the wheel into a clean environment and use it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/fresh/bin/beacon --version
          /tmp/fresh/bin/beacon scenarios
          /tmp/fresh/bin/beacon validate inbox-briefing
          /tmp/fresh/bin/beacon run inbox-briefing
          /tmp/fresh/bin/beacon init smoke-probe
          /tmp/fresh/bin/beacon run scenarios/smoke-probe/scenario.json \
            --adapter command \
            --command "/tmp/fresh/bin/python scenarios/smoke-probe/subjects/compliant.py"

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/project-beacon
    permissions:
      # Trusted publishing: PyPI verifies this workflow's identity directly,
      # so there is no long-lived API token in the repository to leak.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
